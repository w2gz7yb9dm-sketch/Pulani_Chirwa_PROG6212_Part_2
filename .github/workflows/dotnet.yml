
name: RaceDay Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay/RaceDay.slnx

      - name: Build solution
        run: dotnet build RaceDay/RaceDay.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay/RaceDay.slnx --configuration Release --no-build --verbosity normal
